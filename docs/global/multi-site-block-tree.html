<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block-builder: дерево контента · Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · docs/multi-site-templating.md</p>
    <h1>Блочная модель страницы (M2A)</h1>

    <svg viewBox="0 0 1000 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="block-tree-title block-tree-desc">
      <title id="block-tree-title">Directus block-builder: дерево контента</title>
      <desc id="block-tree-desc">Дерево: Directus-инстанс сайта содержит коллекцию pages, каждая страница ссылается на page_blocks (many-to-any junction), которая веером указывает на пять переиспользуемых block-коллекций — hero, services, richtext, gallery и cta.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Tier tags (left margin) -->
      <text x="40" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · SITE</text>
      <text x="40" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 1 · PAGES</text>
      <text x="40" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 2 · JUNCTION</text>
      <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 3 · BLOCK TYPES</text>

      <!-- Connectors drawn first (behind nodes) -->
      <!-- Root -> pages -->
      <path d="M 500 128 L 500 192" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- pages -> page_blocks -->
      <path d="M 500 240 L 500 304" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- page_blocks -> bus -->
      <path d="M 500 352 L 500 384" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- bus (single line, no overlap with the 5 drops below) -->
      <path d="M 164 384 L 836 384" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- drops into each block type -->
      <path d="M 164 384 L 164 416" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 332 384 L 332 416" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 500 384 L 500 416" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 668 384 L 668 416" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 836 384 L 836 416" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Root: Site (Directus) -->
      <rect x="400" y="80" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="80" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="424" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SITE</text>
      <text x="500" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Site (Directus)</text>

      <!-- Tier 1: pages -->
      <rect x="420" y="192" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="192" width="160" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="500" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pages</text>
      <text x="500" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">home · services · about</text>

      <!-- Tier 2: page_blocks (focal — the one new idea) -->
      <rect x="400" y="304" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="304" width="200" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="408" y="312" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="424" y="321" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">M2A</text>
      <text x="500" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">page_blocks</text>
      <text x="500" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sort + collection + item</text>

      <!-- Tier 3: block types (5 leaves) -->
      <rect x="92" y="416" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="92" y="416" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="164" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">block_hero</text>
      <text x="164" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ translations + O2M</text>

      <rect x="260" y="416" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="416" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="332" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">block_services</text>
      <text x="332" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ translations + O2M</text>

      <rect x="428" y="416" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="428" y="416" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="500" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">block_richtext</text>
      <text x="500" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ translations + O2M</text>

      <rect x="596" y="416" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="596" y="416" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="668" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">block_gallery</text>
      <text x="668" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ translations + O2M</text>

      <rect x="764" y="416" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="764" y="416" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="836" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">block_cta</text>
      <text x="836" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ translations + O2M</text>

      <!-- Legend strip -->
      <line x1="40" y1="492" x2="960" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="524" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">page_blocks · M2A (новое)</text>

      <rect x="260" y="524" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">структурный узел</text>

      <rect x="440" y="524" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="460" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">block-тип (переиспользуемый)</text>

      <text x="700" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Каждый block-тип несёт паттерн *_translations + O2M — не 4-й ярус, чтобы остаться в бюджете глубины.</text>
    </svg>
  </div>
</body>
</html>
